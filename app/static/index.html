<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerebellum QC</title>
<style>
  :root {
    --bg: #15171a; --panel: #1d2024; --line: #2e3238; --text: #e6e8eb; --muted: #9aa1aa;
    --accent: #5aa9e6; --ok: #3fb27f; --under: #e0a43a; --over: #d9534f; --sel: #2a3a4c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 230px 1fr 360px; height: 100vh; }
  aside, #panel { background: var(--panel); overflow: hidden; display: flex; flex-direction: column; }
  aside { border-right: 1px solid var(--line); }
  #panel { border-left: 1px solid var(--line); }
  .pad { padding: 10px 12px; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  select, button, textarea { font: inherit; color: var(--text); background: #262a30;
    border: 1px solid var(--line); border-radius: 5px; }
  button { padding: 4px 8px; cursor: pointer; }
  button:hover { border-color: #4a515a; }
  select { width: 100%; padding: 4px; }
  #progress { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #list { overflow-y: auto; flex: 1; border-top: 1px solid var(--line); }
  .item { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer;
    border-bottom: 1px solid #22262b; }
  .item:hover { background: #23272d; }
  .item.cur { background: var(--sel); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4a4f57; flex: none; }
  .dot.Pass { background: var(--ok); } .dot.Edit { background: var(--under); } .dot.Fail { background: var(--over); }
  .item .id { flex: 1; font-variant-numeric: tabular-nums; }
  .who { font-size: 10.5px; color: var(--muted); }
  .dot.other { background: transparent; border: 2px solid #4a4f57; }
  .dot.other.Pass { border-color: var(--ok); } .dot.other.Edit { border-color: var(--under); } .dot.other.Fail { border-color: var(--over); }
  #others { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #others b { color: var(--text); font-weight: 600; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 8px; background: #4b2d2d; color: #f0b4b2; }
  main { display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex-wrap: wrap; }
  #toolbar .grp { display: flex; gap: 4px; align-items: center; margin-right: 10px; }
  #toolbar button.on { background: var(--sel); border-color: var(--accent); }
  #viewer { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #hover { position: absolute; left: 10px; bottom: 8px; background: rgba(0,0,0,.6); padding: 3px 8px;
    border-radius: 4px; pointer-events: none; font-variant-numeric: tabular-nums; }
  #help { color: var(--muted); font-size: 11.5px; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--panel); }
  kbd { background: #2b3036; border: 1px solid #3a4048; border-radius: 3px; padding: 0 4px; font-size: 11px; }
  #subhead { border-bottom: 1px solid var(--line); }
  #subhead .name { font-size: 15px; font-weight: 600; }
  #subhead .meta { color: var(--muted); }
  #flags { margin-top: 6px; color: #f0b4b2; font-size: 12px; }
  #lobules { overflow-y: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; color: var(--muted);
    padding: 5px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
  td { padding: 3px 6px; border-bottom: 1px solid #23272c; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  td.z.flag { color: #f08a86; font-weight: 600; }
  .lname { cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .lname:hover { color: var(--accent); }
  tr.solo td { background: #22303d; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .rb { padding: 1px 6px; font-size: 11.5px; color: var(--muted); }
  .rb.OK.on { background: var(--ok); color: #fff; border-color: var(--ok); }
  .rb.Under.on { background: var(--under); color: #111; border-color: var(--under); }
  .rb.Over.on { background: var(--over); color: #fff; border-color: var(--over); }
  #overall { display: flex; gap: 6px; margin-bottom: 8px; }
  #overall button { flex: 1; padding: 6px; }
  #overall button.Pass.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  #overall button.Edit.on { background: var(--under); border-color: var(--under); color: #111; }
  #overall button.Fail.on { background: var(--over); border-color: var(--over); color: #fff; }
  textarea { width: 100%; height: 64px; padding: 6px; resize: vertical; }
  #bottom { border-top: 1px solid var(--line); }
  #saved { color: var(--muted); font-size: 12px; margin-top: 4px; min-height: 16px; }
  .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="pad">
      <h1>Cerebellum QC</h1>
      <select id="filter">
        <option value="all">All subjects (flagged first)</option>
        <option value="flagged">Flagged only</option>
        <option value="unrated">Not yet rated by me</option>
        <option value="nobody">Not yet rated by anyone</option>
        <option value="byothers">Rated by others only</option>
        <option value="Edit">Rated: needs edit</option>
        <option value="Fail">Rated: fail</option>
      </select>
      <div id="progress"></div>
    </div>
    <div id="list"></div>
  </aside>

  <main>
    <div id="toolbar">
      <div class="grp" id="views">
        <button data-v="mpr" class="on">Multiplanar</button>
        <button data-v="ax">Axial</button>
        <button data-v="cor">Coronal</button>
        <button data-v="sag">Sagittal</button>
        <button data-v="3d">3D</button>
      </div>
      <div class="grp">
        <button id="zoomOut" title="Zoom out (-)">−</button>
        <button id="zoomIn" title="Zoom in (+)">+</button>
        <button id="zoomReset" title="Reset view (0)">Reset</button>
      </div>
      <div class="grp">
        <label for="opacity">Labels</label>
        <input id="opacity" type="range" min="0" max="100" value="45">
        <button id="toggle" title="Show/hide labels (space)">Hide</button>
      </div>
      <div class="grp">
        <button id="prev" title="Previous subject (p)">‹ Prev</button>
        <button id="next" title="Next subject (n)">Next ›</button>
      </div>
    </div>
    <div id="viewer">
      <canvas id="gl"></canvas>
      <div id="hover"></div>
    </div>
    <div id="help">
      <kbd>n</kbd>/<kbd>p</kbd> next/prev subject · <kbd>space</kbd> labels on/off · <kbd>v</kbd> cycle views ·
      click = move crosshair · scroll = change slice · <kbd>+</kbd>/<kbd>-</kbd> zoom around the crosshair · <kbd>0</kbd> reset ·
      click a lobule name to isolate it and jump to it · <kbd>a</kbd> mark unrated lobules OK ·
      <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> pass/edit/fail
    </div>
  </main>

  <section id="panel">
    <div id="subhead" class="pad">
      <div class="name" id="subname">Loading…</div>
      <div class="meta" id="submeta"></div>
      <div id="flags"></div>
      <div id="others"></div>
    </div>
    <div id="lobules">
      <table>
        <thead><tr><th>Lobule</th><th style="text-align:right">cm³</th><th style="text-align:right">z</th><th>Rating</th></tr></thead>
        <tbody id="ltable"></tbody>
      </table>
    </div>
    <div id="bottom" class="pad">
      <div class="row" style="margin-bottom:8px">
        <button id="allok" title="Mark every unrated lobule OK (a)">Unrated lobules → OK</button>
        <button id="clear">Clear ratings</button>
      </div>
      <div id="overall">
        <button class="Pass" data-o="Pass">Pass</button>
        <button class="Edit" data-o="Edit">Needs edit</button>
        <button class="Fail" data-o="Fail">Fail</button>
      </div>
      <textarea id="notes" placeholder="Notes"></textarea>
      <div id="saved"></div>
    </div>
  </section>
</div>

<script src="/static/niivue.umd.js"></script>
<script>
(async function () {
  const NV = window.niivue;
  const $ = (id) => document.getElementById(id);
  const index = await (await fetch("/api/index")).json();
  const rdata = await (await fetch("/api/ratings")).json();
  let ratings = rdata.mine || {};
  const others = rdata.others || {};
  const otherRaters = Object.keys(others).sort();
  function ratedBy(id) { return otherRaters.filter((r) => others[r][id] && others[r][id].overall); }
  const labels = index.labels;
  const nameOf = {}; labels.forEach((l) => (nameOf[l.value] = l.name));
  const zFlag = index.z_flag || 3;

  // Distinct colors for labels
  function hsl2rgb(h, s, l) {
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
  }
  const colors = {};
  labels.forEach((l, i) => (colors[l.value] = hsl2rgb((i * 137.508) % 360, 0.75, i % 2 ? 0.55 : 0.62)));

  let order = [], cur = -1, solo = null, overlayOn = true, view = "mpr";
  const state = { overall: "", lobules: {}, notes: "" };

  // Viewer
  const nv = new NV.Niivue({
    backColor: [0, 0, 0, 1], show3Dcrosshair: true, crosshairColor: [1, 0.85, 0.2, 0.55], crosshairWidth: 0.35,
    dragAndDropEnabled: false, isColorbar: false, textHeight: 0.04, multiplanarForceRender: true,
  });
  await nv.attachTo("gl");
  nv.opts.dragModePrimary = NV.DRAG_MODE_PRIMARY ? NV.DRAG_MODE_PRIMARY.crosshair : 0; // left click/drag: move crosshair
  nv.opts.dragMode = NV.DRAG_MODE.contrast; // right drag: adjust brightness/contrast; mouse wheel: step through slices
  nv.setSliceMM(true);

  function labelCmap() {
    const R = [0], G = [0], B = [0], A = [0], I = [0], L = [""];
    labels.forEach((l) => {
      const c = colors[l.value];
      R.push(c[0]); G.push(c[1]); B.push(c[2]);
      A.push(solo === null || solo === l.value ? 255 : 0);
      I.push(l.value); L.push(l.name);
    });
    return { R, G, B, A, I, labels: L };
  }
  function applyOverlay() {
    if (nv.volumes.length < 2) return;
    nv.volumes[1].setColormapLabel(labelCmap());
    nv.volumes[1].opacity = overlayOn ? $("opacity").value / 100 : 0;
    nv.updateGLVolume();
    $("toggle").textContent = overlayOn ? "Hide" : "Show";
  }
  function setView(v) {
    view = v;
    const S = NV.SLICE_TYPE;
    nv.setSliceType({ mpr: S.MULTIPLANAR, ax: S.AXIAL, cor: S.CORONAL, sag: S.SAGITTAL, "3d": S.RENDER }[v]);
    document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  }
  function zoom(f) {
    if (view === "3d") { nv.setScale((nv.scene.volScaleMultiplier || 1) * f); return; }
    const p = nv.scene.pan2Dxyzmm, z = Math.max(0.5, Math.min(12, p[3] * f)), d = p[3] - z;
    const c = nv.frac2mm(nv.scene.crosshairPos);
    nv.setPan2Dxyzmm([p[0] + d * c[0], p[1] + d * c[1], p[2] + d * c[2], z]);
  }
  function resetView() { nv.setPan2Dxyzmm([0, 0, 0, 1]); nv.setScale(1); }

  nv.onLocationChange = (d) => {
    const v = d.values && d.values[1] ? Math.round(d.values[1].value) : 0;
    const mm = d.mm ? Array.from(d.mm).slice(0, 3).map((x) => x.toFixed(1)).join(", ") : "";
    $("hover").textContent = (v ? nameOf[v] || "Label " + v : "—") + "   (" + mm + " mm)";
  };

  // Subject list
  const subj = {}; index.subjects.forEach((s) => (subj[s.id] = s));
  function sorted() {
    return index.subjects.slice().sort((a, b) => b.flags.length - a.flags.length || a.id.localeCompare(b.id));
  }
  function buildList(keepId) {
    const f = $("filter").value;
    order = sorted().filter((s) => {
      const r = ratings[s.id];
      if (f === "flagged") return s.flags.length > 0;
      if (f === "unrated") return !r || !r.overall;
      if (f === "nobody") return (!r || !r.overall) && ratedBy(s.id).length === 0;
      if (f === "byothers") return (!r || !r.overall) && ratedBy(s.id).length > 0;
      if (f === "Edit" || f === "Fail") return r && r.overall === f;
      return true;
    }).map((s) => s.id);
    const list = $("list"); list.innerHTML = "";
    order.forEach((id, i) => {
      const s = subj[id], r = ratings[id];
      const el = document.createElement("div");
      el.className = "item" + (id === keepId ? " cur" : "");
      const ob = ratedBy(id);
      const dotCls = r && r.overall ? r.overall : (ob.length ? "other " + others[ob[0]][id].overall : "");
      el.innerHTML = '<span class="dot ' + dotCls + '"></span><span class="id">' + id.replace(/_V1_MR$/, "") +
        (ob.length ? ' <span class="who">' + ob.join(" ") + "</span>" : "") +
        "</span>" + (s.flags.length ? '<span class="badge">' + s.flags.length + "</span>" : "");
      el.onclick = () => go(i);
      list.appendChild(el);
    });
    updateProgress();
    cur = keepId ? order.indexOf(keepId) : cur;
  }
  function markCurrent() {
    document.querySelectorAll(".item").forEach((el, i) => el.classList.toggle("cur", i === cur));
    const el = document.querySelectorAll(".item")[cur]; if (el) el.scrollIntoView({ block: "nearest" });
  }

  // Ratings panel
  function renderPanel() {
    const s = subj[order[cur]];
    $("subname").textContent = s.id;
    const total = Object.values(s.vol || {}).reduce((a, b) => a + b, 0);
    $("submeta").textContent = (s.age != null ? "Age " + s.age.toFixed(1) + " · " : "") +
      "Cerebellum " + (total / 1000).toFixed(1) + " cm³" + (s.z_total != null ? " (z " + s.z_total.toFixed(1) + ")" : "");
    $("flags").textContent = s.flags.length ? "Flags: " + s.flags.join(" · ") : "";
    $("others").innerHTML = ratedBy(s.id).map((rt) => {
      const o = others[rt][s.id], lob = o.lobules || {};
      const probs = Object.keys(lob).filter((k) => lob[k] !== "OK").map((k) => k + " " + lob[k].toLowerCase());
      const esc = (x) => String(x).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      return "<b>" + esc(rt) + "</b>: " + esc(o.overall) + (probs.length ? " · " + esc(probs.join(", ")) : "") +
        (o.notes ? " · “" + esc(o.notes) + "”" : "");
    }).join("<br>");
    const tb = $("ltable"); tb.innerHTML = "";
    labels.forEach((l) => {
      const v = String(l.value), vol = s.vol ? s.vol[v] : undefined, z = s.z ? s.z[v] : undefined;
      const tr = document.createElement("tr");
      if (solo === l.value) tr.className = "solo";
      const c = colors[l.value];
      const rat = state.lobules[l.name] || "";
      tr.innerHTML =
        '<td><span class="lname"><span class="sw" style="background:rgb(' + c.join(",") + ')"></span>' + l.name + "</span></td>" +
        '<td class="num">' + (vol !== undefined ? (vol / 1000).toFixed(2) : "missing") + "</td>" +
        '<td class="num z' + (z !== undefined && Math.abs(z) > zFlag ? " flag" : "") + '">' + (z !== undefined ? z.toFixed(1) : "") + "</td>" +
        "<td>" + ["OK", "Under", "Over"].map((o) => '<button class="rb ' + o + (rat === o ? " on" : "") + '" data-o="' + o + '">' + o + "</button>").join(" ") + "</td>";
      tr.querySelector(".lname").onclick = () => isolate(l.value);
      tr.querySelectorAll(".rb").forEach((b) => (b.onclick = () => {
        state.lobules[l.name] = state.lobules[l.name] === b.dataset.o ? "" : b.dataset.o;
        if (!state.lobules[l.name]) delete state.lobules[l.name];
        renderPanel(); save();
      }));
      tb.appendChild(tr);
    });
    document.querySelectorAll("#overall button").forEach((b) => b.classList.toggle("on", b.dataset.o === state.overall));
    if (document.activeElement !== $("notes")) $("notes").value = state.notes;
  }
  function isolate(value) {
    solo = solo === value ? null : value;
    const s = subj[order[cur]], c = s.cent ? s.cent[String(value)] : null;
    if (solo !== null && c && nv.volumes.length) {
      nv.scene.crosshairPos = nv.mm2frac(c);
      nv.drawScene();
      nv.createOnLocationChange && nv.createOnLocationChange();
      resetView(); zoom(2);
    }
    applyOverlay(); renderPanel();
  }

  // Saving
  let saveTimer = null, dirty = false;
  function updateProgress() {
    const done = index.subjects.filter((s) => ratings[s.id] && ratings[s.id].overall).length;
    const any = index.subjects.filter((s) => (ratings[s.id] && ratings[s.id].overall) || ratedBy(s.id).length).length;
    $("progress").textContent = done + " rated by you" + (otherRaters.length ? ", " + any + " by anyone" : "") + " of " + index.subjects.length + " · " +
      index.subjects.filter((s) => s.flags.length).length + " flagged";
  }
  function save(now) {
    clearTimeout(saveTimer); saveTimer = null; dirty = true;
    const id = order[cur], payload = JSON.stringify({ subject: id, overall: state.overall, lobules: state.lobules, notes: state.notes });
    const run = async () => {
      try {
        const r = await fetch("/api/ratings", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.status);
        ratings[id] = { overall: JSON.parse(payload).overall, lobules: JSON.parse(payload).lobules, notes: JSON.parse(payload).notes, timestamp: j.timestamp };
        $("saved").textContent = "Saved " + j.timestamp + " (" + index.rater + ")";
        const dot = document.querySelectorAll(".item .dot")[order.indexOf(id)];
        if (dot) dot.className = "dot " + (ratings[id].overall || "");
        dirty = false; updateProgress();
      } catch (e) { $("saved").textContent = "NOT SAVED: " + e.message; }
    };
    if (now) return run();
    saveTimer = setTimeout(run, 400);
  }

  async function go(i) {
    if (i < 0 || i >= order.length) return;
    if (dirty) await save(true);
    cur = i; solo = null;
    const id = order[cur], r = ratings[id] || {};
    state.overall = r.overall || ""; state.lobules = Object.assign({}, r.lobules || {}); state.notes = r.notes || "";
    $("saved").textContent = r.timestamp ? "Last saved " + r.timestamp : "Not yet rated";
    markCurrent(); renderPanel();
    if (subj[id].error) {
      while (nv.volumes.length) nv.removeVolume(nv.volumes[0]);
      nv.drawScene();
      $("hover").textContent = "Cannot display: " + subj[id].error;
      return;
    }
    await nv.loadVolumes([
      { url: "/data/" + id + "/t1.nii.gz", colormap: "gray", cal_min: 0, cal_max: 255 },
      { url: "/data/" + id + "/seg.nii.gz", opacity: $("opacity").value / 100 },
    ]);
    applyOverlay(); setView(view); resetView();
  }

  // Controls
  $("filter").onchange = () => { const id = order[cur]; buildList(id); if (order.indexOf(id) < 0) go(0); else markCurrent(); };
  document.querySelectorAll("#views button").forEach((b) => (b.onclick = () => setView(b.dataset.v)));
  $("zoomIn").onclick = () => zoom(1.25); $("zoomOut").onclick = () => zoom(0.8); $("zoomReset").onclick = resetView;
  $("opacity").oninput = () => { overlayOn = true; applyOverlay(); };
  $("toggle").onclick = () => { overlayOn = !overlayOn; applyOverlay(); };
  $("prev").onclick = () => go(cur - 1); $("next").onclick = () => go(cur + 1);
  document.querySelectorAll("#overall button").forEach((b) => (b.onclick = () => {
    state.overall = state.overall === b.dataset.o ? "" : b.dataset.o; renderPanel(); save();
  }));
  $("notes").oninput = () => { state.notes = $("notes").value; save(); };
  function allOK() { labels.forEach((l) => { if (!state.lobules[l.name]) state.lobules[l.name] = "OK"; }); renderPanel(); save(); }
  $("allok").onclick = allOK;
  $("clear").onclick = () => { if (confirm("Clear all ratings for this subject?")) { state.lobules = {}; state.overall = ""; state.notes = ""; renderPanel(); save(); } };

  const views = ["mpr", "ax", "cor", "sag", "3d"];
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === "n" || k === "]") go(cur + 1);
    else if (k === "p" || k === "[") go(cur - 1);
    else if (k === " ") { e.preventDefault(); overlayOn = !overlayOn; applyOverlay(); }
    else if (k === "v") setView(views[(views.indexOf(view) + 1) % views.length]);
    else if (k === "+" || k === "=") zoom(1.25);
    else if (k === "-") zoom(0.8);
    else if (k === "0") resetView();
    else if (k === "a") allOK();
    else if (k === "ArrowUp" || k === "ArrowDown") {
      const st = k === "ArrowUp" ? 1 : -1;
      if (view === "cor") nv.moveCrosshairInVox(0, st, 0);
      else if (view === "sag") nv.moveCrosshairInVox(st, 0, 0);
      else nv.moveCrosshairInVox(0, 0, st);
    }
    else if (k === "ArrowLeft" || k === "ArrowRight") nv.moveCrosshairInVox(k === "ArrowRight" ? 1 : -1, 0, 0);
    else if (k === "1" || k === "2" || k === "3") {
      const o = { 1: "Pass", 2: "Edit", 3: "Fail" }[k];
      state.overall = state.overall === o ? "" : o; renderPanel(); save();
    }
    else return;
    e.preventDefault();
  });
  window.addEventListener("beforeunload", () => { if (dirty) save(true); });

  buildList(null);
  if (order.length) go(0);
})();
</script>
